<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 800" width="1180" height="800" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Detailed architecture naming every component: a LangChain Deep Agents coordinator with three browser researcher subagents on AgentCore Browser and one analyst subagent on AgentCore Code Interpreter, hosted on AgentCore Runtime, instrumented by ADOT into CloudWatch aws slash spans, evaluated by AgentCore Evaluations built-in evaluators and a span-based trajectory reader, improved through Batch Insights, Recommendations, Configuration Bundles and an A/B test">
  <title>Deep Agent evaluation on AgentCore: detailed components</title>
  <defs>
    <marker id="d_g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6472"/></marker>
    <marker id="d_b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4d7f97"/></marker>
    <marker id="d_o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b8791f"/></marker>
    <marker id="d_p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8a7aa8"/></marker>
  </defs>
  <rect width="1180" height="800" fill="#ffffff"/>

  <text x="36" y="38" font-size="19" font-weight="600" fill="#1c2530">Detailed component architecture</text>
  <text x="36" y="60" font-size="12.5" fill="#5b6472">Grey = LangChain Deep Agents. Blue = AWS runtime and telemetry. Green = evaluation. Amber = improvement loop.</text>

  <!-- ============ AgentCore Runtime container ============ -->
  <rect x="36" y="84" width="440" height="416" rx="10" fill="#f7f9fb" stroke="#8a97a8" stroke-width="1.8"/>
  <text x="52" y="107" font-size="12" font-weight="600" fill="#5b6472">AMAZON BEDROCK AGENTCORE RUNTIME</text>
  <text x="52" y="124" font-size="10" fill="#7a8595">zip code package, PYTHON_3_13, entryPoint: opentelemetry-instrument main.py</text>

  <rect x="56" y="138" width="400" height="56" rx="7" fill="#eef2f7" stroke="#8a97a8" stroke-width="1.5"/>
  <text x="256" y="160" font-size="13" font-weight="600" text-anchor="middle" fill="#1c2530">Coordinator (LangChain Deep Agents)</text>
  <text x="256" y="179" font-size="10.5" text-anchor="middle" fill="#7a8595">create_deep_agent, delegates with task()</text>

  <rect x="56" y="216" width="126" height="86" rx="7" fill="#eef2f7" stroke="#8a97a8" stroke-width="1.5"/>
  <text x="119" y="237" font-size="11" font-weight="600" text-anchor="middle" fill="#1c2530">research-tcs</text>
  <text x="119" y="253" font-size="9.5" text-anchor="middle" fill="#7a8595">subagent</text>
  <rect x="64" y="262" width="110" height="30" rx="5" fill="#e6eef3" stroke="#4d7f97" stroke-width="1.3"/>
  <text x="119" y="281" font-size="9.5" text-anchor="middle" fill="#1c2530">AgentCore Browser</text>

  <rect x="193" y="216" width="126" height="86" rx="7" fill="#eef2f7" stroke="#8a97a8" stroke-width="1.5"/>
  <text x="256" y="237" font-size="11" font-weight="600" text-anchor="middle" fill="#1c2530">research-infosys</text>
  <text x="256" y="253" font-size="9.5" text-anchor="middle" fill="#7a8595">subagent</text>
  <rect x="201" y="262" width="110" height="30" rx="5" fill="#e6eef3" stroke="#4d7f97" stroke-width="1.3"/>
  <text x="256" y="281" font-size="9.5" text-anchor="middle" fill="#1c2530">AgentCore Browser</text>

  <rect x="330" y="216" width="126" height="86" rx="7" fill="#eef2f7" stroke="#8a97a8" stroke-width="1.5"/>
  <text x="393" y="237" font-size="11" font-weight="600" text-anchor="middle" fill="#1c2530">research-wipro</text>
  <text x="393" y="253" font-size="9.5" text-anchor="middle" fill="#7a8595">subagent</text>
  <rect x="338" y="262" width="110" height="30" rx="5" fill="#e6eef3" stroke="#4d7f97" stroke-width="1.3"/>
  <text x="393" y="281" font-size="9.5" text-anchor="middle" fill="#1c2530">AgentCore Browser</text>

  <text x="456" y="210" font-size="10" text-anchor="end" fill="#5b6472">3 task() calls in parallel, one MicroVM each</text>

  <rect x="56" y="322" width="400" height="72" rx="7" fill="#eef2f7" stroke="#8a97a8" stroke-width="1.5"/>
  <text x="256" y="343" font-size="12" font-weight="600" text-anchor="middle" fill="#1c2530">data-analyst subagent</text>
  <rect x="140" y="352" width="232" height="30" rx="5" fill="#e6eef3" stroke="#4d7f97" stroke-width="1.3"/>
  <text x="256" y="371" font-size="10" text-anchor="middle" fill="#1c2530">AgentCore Code Interpreter (1 MicroVM)</text>

  <rect x="56" y="412" width="196" height="66" rx="7" fill="#e6eef3" stroke="#4d7f97" stroke-width="1.5"/>
  <text x="154" y="434" font-size="11.5" font-weight="600" text-anchor="middle" fill="#1c2530">Amazon Bedrock</text>
  <text x="154" y="451" font-size="10" text-anchor="middle" fill="#4a5563">ChatBedrockConverse</text>
  <text x="154" y="468" font-size="9.5" text-anchor="middle" fill="#7a8595">us.anthropic.claude-sonnet-4-6</text>

  <rect x="262" y="412" width="194" height="66" rx="7" fill="#e6eef3" stroke="#4d7f97" stroke-width="1.5"/>
  <text x="359" y="434" font-size="11.5" font-weight="600" text-anchor="middle" fill="#1c2530">ADOT</text>
  <text x="359" y="451" font-size="10" text-anchor="middle" fill="#4a5563">aws-opentelemetry-distro</text>
  <text x="359" y="468" font-size="9.5" text-anchor="middle" fill="#7a8595">instrumentation-langchain</text>

  <line x1="119" y1="194" x2="119" y2="208" stroke="#5b6472" stroke-width="1.5" marker-end="url(#d_g)"/>
  <line x1="256" y1="194" x2="256" y2="208" stroke="#5b6472" stroke-width="1.5" marker-end="url(#d_g)"/>
  <line x1="393" y1="194" x2="393" y2="208" stroke="#5b6472" stroke-width="1.5" marker-end="url(#d_g)"/>
  <line x1="256" y1="302" x2="256" y2="314" stroke="#5b6472" stroke-width="1.5" marker-end="url(#d_g)"/>

  <!-- ============ data source ============ -->
  <rect x="520" y="132" width="176" height="76" rx="8" fill="#eef2f7" stroke="#8a97a8" stroke-width="1.6"/>
  <text x="608" y="156" font-size="11.5" font-weight="600" text-anchor="middle" fill="#1c2530">Wikipedia</text>
  <text x="608" y="174" font-size="10" text-anchor="middle" fill="#4a5563">revision-pinned (?oldid=)</text>
  <text x="608" y="192" font-size="9.5" text-anchor="middle" fill="#7a8595">immutable answer key</text>

  <line x1="456" y1="266" x2="608" y2="266" stroke="#5b6472" stroke-width="1.6"/>
  <line x1="608" y1="266" x2="608" y2="216" stroke="#5b6472" stroke-width="1.6" marker-end="url(#d_g)"/>
  <text x="468" y="259" font-size="9.5" fill="#5b6472">navigate_browser</text>

  <!-- ============ telemetry ============ -->
  <rect x="520" y="300" width="176" height="116" rx="8" fill="#e6eef3" stroke="#4d7f97" stroke-width="1.8"/>
  <text x="608" y="323" font-size="12" font-weight="600" text-anchor="middle" fill="#1c2530">Amazon CloudWatch</text>
  <text x="608" y="341" font-size="10.5" text-anchor="middle" fill="#4a5563">log group: aws/spans</text>
  <text x="608" y="359" font-size="9.5" text-anchor="middle" fill="#7a8595">gen_ai.operation.name</text>
  <text x="608" y="375" font-size="9.5" text-anchor="middle" fill="#7a8595">gen_ai.tool.name, session.id</text>
  <text x="608" y="397" font-size="10" text-anchor="middle" fill="#4a5563">Transaction Search ON</text>

  <line x1="456" y1="445" x2="608" y2="445" stroke="#4d7f97" stroke-width="1.8"/>
  <line x1="608" y1="445" x2="608" y2="424" stroke="#4d7f97" stroke-width="1.8" marker-end="url(#d_b)"/>

  <rect x="520" y="456" width="176" height="66" rx="8" fill="#f2eef7" stroke="#8a7aa8" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="608" y="479" font-size="11.5" font-weight="600" text-anchor="middle" fill="#1c2530">LangSmith</text>
  <text x="608" y="496" font-size="10" text-anchor="middle" fill="#4a5563">optional, LOCAL runs only</text>
  <text x="608" y="513" font-size="9.5" text-anchor="middle" fill="#7a8595">agentevals, datasets</text>

  <!-- ============ evaluation ============ -->
  <rect x="736" y="84" width="408" height="416" rx="10" fill="#f5f9f5" stroke="#a8c0a8" stroke-width="1.8"/>
  <text x="752" y="107" font-size="12" font-weight="600" fill="#5d8a5d">EVALUATION, BOTH PATHS READ THE SAME SPANS</text>

  <rect x="756" y="122" width="368" height="140" rx="7" fill="#e8f0e8" stroke="#5d8a5d" stroke-width="1.5"/>
  <text x="940" y="145" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1c2530">AgentCore Evaluations</text>
  <text x="940" y="161" font-size="9.5" text-anchor="middle" fill="#7a8595">Evaluate API, evaluationInput.sessionSpans</text>
  <text x="774" y="186" font-size="10" font-weight="600" fill="#4a5563">SESSION</text>
  <text x="858" y="186" font-size="10" fill="#7a8595">GoalSuccessRate, Trajectory*Match</text>
  <text x="774" y="207" font-size="10" font-weight="600" fill="#4a5563">TRACE</text>
  <text x="858" y="207" font-size="10" fill="#7a8595">Correctness, Helpfulness</text>
  <text x="774" y="228" font-size="10" font-weight="600" fill="#4a5563">TOOL_CALL</text>
  <text x="858" y="228" font-size="10" fill="#7a8595">ToolSelectionAccuracy, ToolParameterAccuracy</text>
  <text x="940" y="251" font-size="10" text-anchor="middle" fill="#5d8a5d">judges the answer</text>

  <rect x="756" y="280" width="368" height="118" rx="7" fill="#e8f0e8" stroke="#5d8a5d" stroke-width="1.5"/>
  <text x="940" y="303" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1c2530">Trajectory reader</text>
  <text x="940" y="319" font-size="9.5" text-anchor="middle" fill="#7a8595">agentcore_evals.py, framework agnostic</text>
  <text x="774" y="342" font-size="10" fill="#7a8595">max_concurrent(), peak overlap not calls per turn</text>
  <text x="774" y="361" font-size="10" fill="#7a8595">is_nested(), interval containment</text>
  <text x="774" y="380" font-size="10" fill="#7a8595">tool call count, retries, duration</text>
  <text x="940" y="393" font-size="10" text-anchor="middle" fill="#5d8a5d">judges the work</text>

  <rect x="756" y="416" width="368" height="62" rx="7" fill="#eef2f7" stroke="#8a97a8" stroke-width="1.5"/>
  <text x="940" y="438" font-size="11.5" font-weight="600" text-anchor="middle" fill="#1c2530">Ground truth</text>
  <text x="940" y="456" font-size="9.5" text-anchor="middle" fill="#7a8595">assertions, expectedTrajectory (leaf tools only),</text>
  <text x="940" y="471" font-size="9.5" text-anchor="middle" fill="#7a8595">expectedResponse</text>

  <line x1="696" y1="336" x2="748" y2="200" stroke="#5b6472" stroke-width="1.8" marker-end="url(#d_g)"/>
  <line x1="696" y1="356" x2="748" y2="340" stroke="#5b6472" stroke-width="1.8" marker-end="url(#d_g)"/>

  <!-- ============ improvement loop ============ -->
  <text x="36" y="548" font-size="12" font-weight="600" fill="#b8791f">IMPROVEMENT LOOP</text>
  <rect x="36" y="560" width="1108" height="150" rx="10" fill="#fdf8ee" stroke="#dcc08a" stroke-width="1.8"/>

  <rect x="60" y="584" width="248" height="102" rx="7" fill="#fbf0dd" stroke="#b8791f" stroke-width="1.5"/>
  <text x="184" y="606" font-size="12" font-weight="600" text-anchor="middle" fill="#1c2530">Batch Insights</text>
  <text x="184" y="622" font-size="9.5" text-anchor="middle" fill="#7a8595">StartBatchEvaluation(insights)</text>
  <text x="74" y="645" font-size="10" fill="#4a5563">Builtin.Insight.FailureAnalysis</text>
  <text x="74" y="662" font-size="10" fill="#4a5563">Builtin.Insight.UserIntent</text>
  <text x="74" y="679" font-size="10" fill="#4a5563">Builtin.Insight.ExecutionSummary</text>

  <rect x="342" y="584" width="248" height="102" rx="7" fill="#fbf0dd" stroke="#b8791f" stroke-width="1.5"/>
  <text x="466" y="606" font-size="12" font-weight="600" text-anchor="middle" fill="#1c2530">Recommendations</text>
  <text x="466" y="622" font-size="9.5" text-anchor="middle" fill="#7a8595">StartRecommendation</text>
  <text x="356" y="645" font-size="10" fill="#4a5563">SYSTEM_PROMPT_RECOMMENDATION</text>
  <text x="356" y="662" font-size="10" fill="#4a5563">targets one evaluator</text>
  <text x="356" y="679" font-size="10" fill="#7a8595">metric choice sets fix direction</text>

  <rect x="624" y="584" width="248" height="102" rx="7" fill="#fbf0dd" stroke="#b8791f" stroke-width="1.5"/>
  <text x="748" y="606" font-size="12" font-weight="600" text-anchor="middle" fill="#1c2530">Configuration Bundles</text>
  <text x="748" y="622" font-size="9.5" text-anchor="middle" fill="#7a8595">CreateConfigurationBundle</text>
  <text x="638" y="645" font-size="10" fill="#4a5563">versioned system prompt</text>
  <text x="638" y="662" font-size="10" fill="#4a5563">applied at invoke via baggage</text>
  <text x="638" y="679" font-size="10" fill="#7a8595">no redeploy</text>

  <rect x="906" y="584" width="214" height="102" rx="7" fill="#fbf0dd" stroke="#b8791f" stroke-width="1.5"/>
  <text x="1013" y="606" font-size="12" font-weight="600" text-anchor="middle" fill="#1c2530">A/B test</text>
  <text x="1013" y="622" font-size="9.5" text-anchor="middle" fill="#7a8595">two bundles, one Runtime</text>
  <text x="920" y="645" font-size="10" fill="#4a5563">control vs treatment</text>
  <text x="920" y="662" font-size="10" fill="#4a5563">completion rate</text>
  <text x="920" y="679" font-size="10" fill="#4a5563">tool calls, duration</text>

  <line x1="308" y1="635" x2="334" y2="635" stroke="#b8791f" stroke-width="1.8" marker-end="url(#d_o)"/>
  <line x1="590" y1="635" x2="616" y2="635" stroke="#b8791f" stroke-width="1.8" marker-end="url(#d_o)"/>
  <line x1="872" y1="635" x2="898" y2="635" stroke="#b8791f" stroke-width="1.8" marker-end="url(#d_o)"/>

  <line x1="520" y1="358" x2="500" y2="358" stroke="#b8791f" stroke-width="1.8"/>
  <line x1="500" y1="358" x2="500" y2="534" stroke="#b8791f" stroke-width="1.8"/>
  <line x1="500" y1="534" x2="184" y2="534" stroke="#b8791f" stroke-width="1.8"/>
  <line x1="184" y1="534" x2="184" y2="576" stroke="#b8791f" stroke-width="1.8" marker-end="url(#d_o)"/>

  <line x1="1013" y1="686" x2="1013" y2="744" stroke="#b8791f" stroke-width="1.8"/>
  <line x1="1013" y1="744" x2="18" y2="744" stroke="#b8791f" stroke-width="1.8"/>
  <line x1="18" y1="744" x2="18" y2="166" stroke="#b8791f" stroke-width="1.8"/>
  <line x1="18" y1="166" x2="48" y2="166" stroke="#b8791f" stroke-width="1.8" marker-end="url(#d_o)"/>

  <line x1="480" y1="489" x2="512" y2="489" stroke="#8a7aa8" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#d_p)"/>
  <text x="392" y="493" font-size="9.5" fill="#8a7aa8">local run only</text>
